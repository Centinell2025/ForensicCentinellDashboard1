apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: centinell-forensics
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [forensics.example.com]
      secretName: centinell-forensics-tls
  rules:
    - host: forensics.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: centinell-forensics, port: { number: 80 } }
