apiVersion: apps/v1
kind: Deployment
metadata: { name: centinell-forensics }
spec:
  replicas: 2
  selector: { matchLabels: { app: centinell-forensics } }
  template:
    metadata: { labels: { app: centinell-forensics } }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: app
          image: ghcr.io/centinell2025/forensiccentinelldashboard1:latest
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: centinell-forensics-secrets } }]
          readinessProbe: { httpGet: { path: /api/v1/ready, port: 3000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 3000 }, initialDelaySeconds: 20 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
