apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: centinell-forensics }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: centinell-forensics }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
