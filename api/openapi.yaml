openapi: 3.1.0
info:
  title: Centinell Forensics Enterprise API
  version: 1.1.0
  description: Tenant-isolated DFIR case, audit, authentication, and AI API.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Database-backed health check
      responses:
        '200': { description: Healthy }
  /auth/register:
    post:
      summary: Create an organization and its first administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Register' }
      responses:
        '201': { description: Organization created }
        '400': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      summary: Start a secure HTTP-only session
      responses:
        '200': { description: Authenticated }
        '401': { $ref: '#/components/responses/Problem' }
  /cases:
    get:
      summary: List cases for the authenticated tenant
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Tenant case list }
    post:
      summary: Create a tenant case
      security: [{ cookieAuth: [] }]
      responses:
        '201': { description: Case created }
        '403': { $ref: '#/components/responses/Problem' }
  /audit:
    get:
      summary: List tenant audit events
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Audit event list }
  /dashboard/summary:
    get:
      summary: Return tenant-scoped operational metrics and audit-chain status
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Current dashboard summary }
        '401': { $ref: '#/components/responses/Problem' }
  /dashboard/kpis:
    get:
      summary: Return live tenant-scoped KPI snapshot
      description: Counts are read from existing tenant tables and the existing hash-chained audit verifier. No custody or evidence row is written.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current KPI snapshot with UTC generation time
          content:
            application/json: { schema: { $ref: '#/components/schemas/KpiSnapshot' } }
        '401': { $ref: '#/components/responses/Problem' }
  /dashboard/kpis/stream:
    get:
      summary: Stream tenant-scoped KPI events over Server-Sent Events
      description: The stream sends kpi.snapshot, kpi.event, and keep-alive frames. A session cookie supplies tenant context.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream: { schema: { type: string } }
        '401': { $ref: '#/components/responses/Problem' }
  /evidence:
    get:
      summary: List safe evidence metadata without cryptographic key material
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Tenant evidence metadata }
        '401': { $ref: '#/components/responses/Problem' }
  /evidence/{evidenceKey}:
    get:
      summary: Return tenant-scoped evidence metadata and audit history
      description: Returns acquisition metadata, SHA-256 processing state, audit hashes, and chain status without IVs, authentication tags, or encrypted data keys.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: evidenceKey, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 240 } }
      responses:
        '200':
          description: Evidence drawer detail
          content:
            application/json: { schema: { $ref: '#/components/schemas/EvidenceDetail' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /evidence/{evidenceKey}/retry:
    post:
      summary: Request an audited SHA-256 processing retry
      description: Admin and analyst action. Appends one hash-chained audit event and leaves evidence, custody, RLS policies, and existing hashes unchanged until a separate processing worker completes.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: evidenceKey, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 240 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1, maxLength: 240 }
      responses:
        '202':
          description: Retry intent accepted and audited
          content:
            application/json: { schema: { $ref: '#/components/schemas/HashRetryResponse' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /evidence/{evidenceKey}/custody-state:
    post:
      summary: Record an append-only tenant custody state event
      description: Admin and analyst action. Adds a hash-chained audit event for a custody transition without rewriting the evidence object, existing custody history, RLS policies, or database schema.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: evidenceKey, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 240 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [in_review, legal_hold, released] }
                reason: { type: string, minLength: 1, maxLength: 240 }
      responses:
        '202':
          description: Custody state event accepted and audited
          content:
            application/json: { schema: { $ref: '#/components/schemas/CustodyStateResponse' } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /analysis:
    get:
      summary: Correlate cases, evidence metadata, and hash-chained audit events
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: module, in: query, schema: { type: string } }
        - { name: metric, in: query, schema: { type: string } }
      responses:
        '200': { description: Tenant-scoped technical analysis }
        '401': { $ref: '#/components/responses/Problem' }
  /advisor-directive:
    get:
      summary: Return the authenticated user's tenant or case-scoped forensic directive
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: caseId, in: query, schema: { type: string, format: uuid, nullable: true } }
      responses:
        '200':
          description: Current directive or the immutable default fallback
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdvisorDirective' } }
        '401': { $ref: '#/components/responses/Problem' }
    put:
      summary: Save the authenticated user's tenant or case-scoped forensic directive
      description: The full value is stored and the update is hash-chained in the tenant audit stream; external audit anchoring remains best-effort and scheduled by the existing audit-anchor worker.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [directive]
              properties:
                directive: { type: string, minLength: 1, maxLength: 12000 }
                caseId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Directive saved and audited
          content:
            application/json: { schema: { $ref: '#/components/schemas/AdvisorDirective' } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /forensic-findings:
    get:
      summary: List normalized tenant-scoped forensic findings for copilot context
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: caseId, in: query, schema: { type: string, format: uuid, nullable: true } }
      responses:
        '200':
          description: Verified and pending-verification findings without evidence payloads
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, items: { $ref: '#/components/schemas/ForensicFinding' } }
        '401': { $ref: '#/components/responses/Problem' }
  /reports/drafts:
    get:
      summary: List AI report drafts requiring human verification
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: caseId, in: query, schema: { type: string, format: uuid, nullable: true } }
      responses:
        '200': { description: Tenant-scoped report drafts }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      summary: Persist an AI response as a pending-verification report draft
      description: The API always assigns pending_verification and never accepts a client-supplied confirmed status.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                title: { type: string, maxLength: 180 }
                body: { type: string, minLength: 1, maxLength: 30000 }
                caseId: { type: string, format: uuid, nullable: true }
                citedFindingIds: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '201': { description: Pending-verification report draft created }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /investigation/execute:
    post:
      summary: Execute an allowlisted defensive investigation operation
      description: Does not expose an operating-system shell. Every accepted command is tenant-scoped and audited.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, enum: [help, cases, evidence, audit, chain-verify, ioc, packet-summary] }
                argument: { type: string, maxLength: 120000 }
      responses:
        '200': { description: Defensive analysis result }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: centinell_session }
  schemas:
    Register:
      type: object
      required: [organization, fullName, email, password]
      properties:
        organization: { type: string, minLength: 2, maxLength: 120 }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 128 }
    AdvisorDirective:
      type: object
      required: [directive, isDefault]
      properties:
        directive: { type: string, maxLength: 12000 }
        isDefault: { type: boolean }
        caseId: { type: string, format: uuid, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    ForensicFinding:
      type: object
      required: [id, source, status, title]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid, nullable: true }
        source: { type: string, enum: [hayabusa, oletools, pdfid, exiftool, email] }
        status: { type: string, enum: [pending_verification, verified] }
        title: { type: string }
        summary: { type: string }
        artifactId: { type: string }
        artifactSha256: { type: string }
        toolVersion: { type: string }
        createdAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time, nullable: true }
    KpiSnapshot:
      type: object
      required: [version, generatedAt, tenantScoped, kpis, evidenceIntegrity, intensity, storage, audit]
      properties:
        version: { type: string, const: 1.1.0 }
        generatedAt: { type: string, format: date-time }
        source: { type: string, const: tenant_database }
        tenantScoped: { type: boolean, const: true }
        kpis:
          type: object
          properties:
            activeCases: { type: integer, minimum: 0 }
            criticalAlerts: { type: integer, minimum: 0 }
            casesInReview: { type: integer, minimum: 0 }
            casesThisMonth: { type: integer, minimum: 0 }
            totalEvidenceItems: { type: integer, minimum: 0 }
            verifiedHashes: { type: integer, minimum: 0 }
            pendingIntake: { type: integer, minimum: 0 }
            storageUsedBytes: { type: string, pattern: '^[0-9]+$' }
            storageUsedLabel: { type: string }
            assetsAtRisk: { type: integer, nullable: true }
        evidenceIntegrity:
          type: object
          properties:
            algorithm: { type: string, const: SHA-256 }
            totalItems: { type: integer }
            verifiedHashes: { type: integer }
            pendingIntake: { type: integer }
            percentage: { type: number }
        intensity:
          type: object
          description: Live RAM-style analytical load or integrity coverage. Percentages are derived from tenant data and configured service capacities; unavailable sources are explicit nulls.
          additionalProperties:
            type: object
            required: [percent, label, semantic, severity, basis]
            properties:
              percent: { type: number, minimum: 0, maximum: 100, nullable: true }
              label: { type: string }
              semantic: { type: string, enum: [load, coverage] }
              severity: { type: string, enum: [low, medium, high, critical, verified, unavailable] }
              basis: { type: string }
        storage:
          type: object
          properties:
            usedBytes: { type: string, pattern: '^[0-9]+$' }
            allocatedBytes: { type: string, nullable: true, pattern: '^[0-9]+$' }
            utilizationPercent: { type: number, nullable: true }
        audit:
          type: object
          properties:
            events24h: { type: integer }
            lastEventAt: { type: string, format: date-time, nullable: true }
            chainValid: { type: boolean }
    EvidenceDetail:
      type: object
      required: [version, generatedAt, tenantScoped, evidence, acquisitionMetadata, processing, history, audit]
      properties:
        version: { type: string, const: 1.1.0 }
        generatedAt: { type: string, format: date-time }
        tenantScoped: { type: boolean, const: true }
        evidence: { type: object, description: Safe evidence projection; cryptographic key material is omitted. }
        acquisitionMetadata: { type: object }
        processing:
          type: object
          properties:
            status: { type: string, enum: [pending_verification, verified] }
            algorithm: { type: string, const: SHA-256 }
            hashPresent: { type: boolean }
            retryAvailable: { type: boolean }
        history: { type: array, items: { type: object } }
        audit:
          type: object
          properties:
            chainValid: { type: boolean }
            events: { type: array, items: { type: object } }
    HashRetryResponse:
      type: object
      required: [version, accepted, status, retryRequestId, processing, audit]
      properties:
        version: { type: string, const: 1.1.0 }
        accepted: { type: boolean, const: true }
        status: { type: string, const: retry_requested }
        retryRequestId: { type: string, format: uuid }
        evidence: { type: object }
        acquisitionMetadata: { type: object }
        processing:
          type: object
          properties:
            status: { type: string, const: pending_verification }
            algorithm: { type: string, const: SHA-256 }
            hashUnchanged: { type: boolean, const: true }
            retryAvailable: { type: boolean }
        audit: { type: object }
    CustodyStateResponse:
      type: object
      required: [version, accepted, status, custodyState, history, audit]
      properties:
        version: { type: string, const: 1.1.0 }
        accepted: { type: boolean, const: true }
        status: { type: string, const: custody_state_recorded }
        custodyState: { type: string, enum: [in_review, legal_hold, released] }
        evidence: { type: object }
        acquisitionMetadata: { type: object }
        history: { type: array, items: { type: object } }
        audit: { type: object }
  responses:
    Problem:
      description: RFC 7807-style problem response
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              status: { type: integer }
